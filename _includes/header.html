<header class="site-header">
  <div class="content-width header-top">
    <a class="brand" href="{{ '/' | relative_url }}">
      <strong>郝跃强</strong><span>的技术博客</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span class="sr-only">打开导航</span>
    </button>
  </div>
  <div class="nav-bar">
    <nav class="site-nav content-width" id="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/posts/' | relative_url }}" {% if page.url contains '/posts' or page.layout == 'post' %}aria-current="page"{% endif %}>全部笔记</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.url contains '/archive' %}aria-current="page"{% endif %}>日期归档</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url contains '/tags' %}aria-current="page"{% endif %}>标签</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>项目</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>关于</a>
      <a class="nav-github" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
  </div>
</header>
